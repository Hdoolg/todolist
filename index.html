<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니멀 투두 리스트 - 3단계 (완성)</title>
  <!-- Tailwind CSS CDN 사용으로 깔끔하고 현대적인 UI 구성 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts에서 Noto Sans KR 적용 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f8fafc; /* 매우 밝고 깨끗한 그레이톤 배경 */
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- 메인 카드 컨테이너 -->
  <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 transition-all duration-300 hover:shadow-md">
    
    <!-- 헤더 영역 -->
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Todo List</h1>
      <p class="text-sm text-slate-400 mt-1">오늘 할 일을 가볍게 정리해 보세요.</p>
    </div>

    <!-- 1단계: 할 일 입력창 영역 -->
    <div class="space-y-3">
      <div class="flex gap-2">
        <!-- 할 일 입력 Input -->
        <input 
          type="text" 
          id="todo-input" 
          placeholder="할 일을 입력하세요..." 
          class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 focus:bg-white transition-all duration-200"
          autocomplete="off"
        />
        <!-- 추가 버튼 (+) -->
        <button 
          id="add-button"
          class="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium rounded-xl shadow-sm shadow-indigo-100 transition-all duration-150 flex items-center justify-center"
        >
          <!-- 플러스(+) 아이콘 SVG -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
        </button>
      </div>

      <!-- 공백 입력 시 나타날 동적 에러 메시지 공간 (기본 숨김) -->
      <p id="error-message" class="text-xs text-rose-500 hidden transition-all duration-200">
        ⚠️ 내용을 입력해 주세요. (공백은 등록할 수 없습니다)
      </p>
    </div>

    <!-- 2/3단계: 할 일 목록 영역 -->
    <div class="mt-8">
      <!-- 목록의 타이틀 및 개수 표시 -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-slate-500">할 일 목록</h2>
        <span id="todo-count" class="text-xs font-bold px-2 py-0.5 bg-slate-100 text-slate-500 rounded-full">0</span>
      </div>

      <!-- 실제 할 일 아이템들이 추가될 공간 -->
      <ul id="todo-list" class="space-y-2.5 max-h-[280px] overflow-y-auto pr-1">
        <!-- JS에 의해 동적으로 생성됩니다. -->
      </ul>

      <!-- 할 일이 없을 때 보여줄 빈 상태(Empty State) 디자인 -->
      <div id="empty-state" class="py-12 flex flex-col items-center justify-center text-center">
        <div class="p-3 bg-slate-50 rounded-full text-slate-300 mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.375c.9 0 1.625-.725 1.625-1.625v-.375c0-.9-.725-1.625-1.625-1.625H9.75M12 21a9.75 9.75 0 1 0 0-19.5 9.75 9.75 0 0 0 0 19.5Z" />
          </svg>
        </div>
        <p class="text-sm text-slate-400">아직 등록된 할 일이 없습니다.</p>
      </div>
    </div>

  </div>

  <script>
    // DOM 요소 선택
    const todoInput = document.getElementById('todo-input');
    const addButton = document.getElementById('add-button');
    const errorMessage = document.getElementById('error-message');
    const todoList = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const todoCount = document.getElementById('todo-count');

    // 할 일 데이터를 담을 배열
    let todos = [];

    // 페이지 로드 시 즉시 입력창에 포커스
    window.onload = () => {
      todoInput.focus();
      renderTodos();
    };

    // 할 일 렌더링 함수
    function renderTodos() {
      // 1. 목록 비우기
      todoList.innerHTML = '';

      // 2. 데이터 유무에 따른 빈 화면(Empty State) 처리
      if (todos.length === 0) {
        emptyState.classList.remove('hidden');
        todoList.classList.add('hidden');
      } else {
        emptyState.classList.add('hidden');
        todoList.classList.remove('hidden');
      }

      // 3. 할 일 개수 업데이트 (남은 할 일 기준이 아닌 전체 등록 건수 표시)
      todoCount.textContent = todos.length;

      // 4. 배열을 돌며 화면에 하나씩 그리기
      todos.forEach((todo) => {
        const li = document.createElement('li');
        
        // 완료 여부에 따른 스타일 조건부 지정
        const itemClass = todo.completed 
          ? 'group flex items-center justify-between p-3.5 bg-slate-50/50 border border-slate-100/50 rounded-xl transition-all duration-150 opacity-60' 
          : 'group flex items-center justify-between p-3.5 bg-slate-50 hover:bg-slate-100/70 border border-slate-100 rounded-xl transition-all duration-150';

        const textClass = todo.completed
          ? 'text-sm text-slate-400 font-medium line-through decoration-slate-300'
          : 'text-sm text-slate-700 font-medium';

        const checkboxClass = todo.completed
          ? 'w-5 h-5 rounded-full border-2 border-indigo-500 bg-indigo-500 flex items-center justify-center cursor-pointer transition-all duration-150'
          : 'w-5 h-5 rounded-full border-2 border-slate-300 flex items-center justify-center bg-white cursor-pointer hover:border-indigo-400 transition-all duration-150';

        li.className = itemClass;
        
        // 체크박스 내 내부 체크 아이콘
        const checkIcon = todo.completed
          ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="white" class="w-3 h-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
             </svg>`
          : '';

        li.innerHTML = `
          <div class="flex items-center gap-3 flex-1 min-w-0">
            <!-- 체크박스 영역 -->
            <button onclick="toggleTodo(${todo.id})" class="${checkboxClass}" aria-label="할 일 완료 토글">
              ${checkIcon}
            </button>
            <!-- 할 일 텍스트 영역 (클릭해도 토글 가능하도록 구성) -->
            <span onclick="toggleTodo(${todo.id})" class="${textClass} cursor-pointer truncate flex-1">${escapeHtml(todo.text)}</span>
          </div>
          <!-- 삭제 버튼 (그룹 호버 시 또는 모바일에서 항상 반투명하게 노출) -->
          <button 
            onclick="deleteTodo(${todo.id})"
            class="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg opacity-0 group-hover:opacity-100 focus:opacity-100 md:transition-opacity duration-150"
            aria-label="할 일 삭제"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
            </svg>
          </button>
        `;
        
        todoList.appendChild(li);
      });
    }

    // HTML 인젝션 방지 보안 헬퍼 함수
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 할 일 등록 처리 함수
    function handleAddTodo() {
      const todoText = todoInput.value.trim();

      // 예외 처리: 공백 입력 방지
      if (todoText === '') {
        showErrorMessage();
        return;
      }

      // 새 할 일 객체 생성 (completed 속성 추가)
      const newTodo = {
        id: Date.now(), // 고유 ID 부여
        text: todoText,
        completed: false // 기본값은 완료하지 않은 상태
      };
      todos.push(newTodo);

      // 화면 새로고침
      renderTodos();
      hideErrorMessage();

      // 입력 후 자동 비우기 및 자동 포커스 유지
      todoInput.value = '';
      todoInput.focus();

      // 시각적 피드백: 입력창을 잠깐 반짝이게 하여 등록 성공을 알림
      todoInput.classList.add('ring-2', 'ring-emerald-500/20', 'border-emerald-500');
      setTimeout(() => {
        todoInput.classList.remove('ring-2', 'ring-emerald-500/20', 'border-emerald-500');
      }, 500);
    }

    // 3단계 핵심: 완료 상태 변경(토글) 함수
    function toggleTodo(id) {
      todos = todos.map(todo => {
        if (todo.id === id) {
          return { ...todo, completed: !todo.completed };
        }
        return todo;
      });
      renderTodos();
    }

    // 추가 기능: 할 일 삭제 함수
    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      renderTodos();
    }

    // 에러 메시지 표시 함수
    function showErrorMessage() {
      errorMessage.classList.remove('hidden');
      todoInput.classList.add('border-rose-400', 'focus:ring-rose-500/20', 'focus:border-rose-500');
      todoInput.focus();
    }

    // 에러 메시지 숨김 함수
    function hideErrorMessage() {
      errorMessage.classList.add('hidden');
      todoInput.classList.remove('border-rose-400', 'focus:ring-rose-500/20', 'focus:border-rose-500');
    }

    // 이벤트 리스너 등록
    addButton.addEventListener('click', handleAddTodo);

    todoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        handleAddTodo();
      }
    });

    todoInput.addEventListener('input', () => {
      if (todoInput.value.trim() !== '') {
        hideErrorMessage();
      }
    });
  </script>
</body>
</html>
